[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "baja_studio"
# From baja_studio/__init__.py, where the release build stamps the git tag.
dynamic = ["version"]
description = "Baja Studio: one service for the studio tools (camera control, playout, audio)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "websockets==17.4",
    "pydantic==2.14.2",
    # The agent client's HTTP side (and Starlette's TestClient in the tests).
    "httpx2==2.16.0",
    # The RS485 joystick controller (Pelco-D), camera control (WP2).
    "pyserial==3.5",
    # The M-VAVE SMC-Mixer, audio (WP4); only ever imported inside the MIDI child process.
    "python-rtmidi==1.5.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "types-pyserial==3.5.0.20261030",
]

[project.scripts]
baja-studio = "baja_studio.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "baja_studio.__version__" }

[tool.setuptools.packages.find]
include = ["baja_studio*"]

[tool.setuptools.package-data]
# The rehearsal rig's scenarios are data (ADR 0016).
"baja_studio.rig" = ["scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The rig's integration tests open loopback sockets; they run on their own (`pytest -m rig`).
addopts = "-ra -m 'not rig'"
markers = ["rig: the rehearsal rig's integration tests (real fakes on loopback ports)"]
# A test that hangs is a bug; this turns a hang into a clear failure.
faulthandler_timeout = 60
# Warnings are bugs (an unclosed pipe, a deprecated call): fail on them, in CI too.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["baja_studio", "tests"]

[[tool.mypy.overrides]]
# python-rtmidi ships no type information; midi_rtmidi.py keeps its objects as `Any`.
module = ["rtmidi"]
ignore_missing_imports = true
