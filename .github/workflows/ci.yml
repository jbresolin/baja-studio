name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "server[dev]"
      - name: Lint (ruff)
        working-directory: server
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy --strict)
        # Twice, so the Windows-only code (sys.platform == "win32") is checked
        # on every runner, not just on Windows.
        working-directory: server
        run: |
          mypy
          mypy --platform win32
      - name: Test (pytest)
        working-directory: server
        run: pytest
      # The rehearsal rig's integration tests (ADR 0016): every fake on loopback
      # ports, and playout's readiness wants ffmpeg/ffprobe on PATH.
      - name: Install ffmpeg (rig tests)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg -y --no-progress
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      # The feeds rig tests run the real MediaMTX (WP14): the pinned Linux build,
      # checked against its SHA-256. On Windows they are skipped.
      - name: Download the pinned MediaMTX (feeds rig tests)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pin=installer/mediamtx/pin.json
          url=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['linux_url'])" $pin)
          sha=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['linux_sha256'])" $pin)
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/mediamtx.tar.gz" "$url"
          echo "$sha  $RUNNER_TEMP/mediamtx.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mediamtx"
          tar xzf "$RUNNER_TEMP/mediamtx.tar.gz" -C "$RUNNER_TEMP/mediamtx"
          echo "BAJA_STUDIO_TEST_MEDIAMTX=$RUNNER_TEMP/mediamtx/mediamtx" >> "$GITHUB_ENV"
      # The camera node's video tests run the pinned node ffmpeg (WP15, ADR 0023):
      # on Windows the very build the node installer bundles, on Linux the build
      # of the same version for Linux. Both are checked against their SHA-256;
      # tests/rig/test_node_ffmpeg_pin.py then checks the features the node needs.
      - name: Download the pinned node ffmpeg (camera node video rig tests)
        shell: bash
        run: |
          pin=installer/ffmpeg-node/pin.json
          field() { python -c "import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])" $pin "$1"; }
          mkdir -p "$RUNNER_TEMP/ffmpeg-node"
          cd "$RUNNER_TEMP/ffmpeg-node"
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL --retry 5 -o ffmpeg.zip "$(field url)"
            echo "$(field sha256)  ffmpeg.zip" | sha256sum -c -
            python -m zipfile -e ffmpeg.zip .
            folder="$(field folder_in_zip)"
            binary="$(cygpath -w "$PWD/$folder/bin/ffmpeg.exe")"
          else
            curl -fsSL --retry 5 -o ffmpeg.tar.xz "$(field linux_url)"
            echo "$(field linux_sha256)  ffmpeg.tar.xz" | sha256sum -c -
            tar xJf ffmpeg.tar.xz
            binary="$PWD/$(field linux_folder_in_archive)/bin/ffmpeg"
          fi
          "$binary" -hide_banner -version | head -1
          echo "BAJA_STUDIO_TEST_NODE_FFMPEG=$binary" >> "$GITHUB_ENV"
      - name: Test the rehearsal rig (pytest -m rig)
        working-directory: server
        run: pytest -m rig

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  dist:
    # Assembles dist\ (no installer, no Caddy) when a pull request touches the
    # installer or the dependencies, so a wheel missing for win_amd64 shows up
    # here rather than on release day.
    name: Installer folder (dist)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the installer or the dependencies change?
        id: changes
        run: |
          $changed = git diff --name-only "origin/$env:GITHUB_BASE_REF...HEAD"
          $relevant = $changed | Where-Object { $_ -like 'installer/*' -or $_ -eq 'server/pyproject.toml' }
          "build=$([bool]$relevant)".ToLower() >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.build == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.build == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Assemble dist\app without Caddy
        if: steps.changes.outputs.build == 'true'
        run: ./installer/build.ps1 -SkipCaddy

  tray:
    # The tray icon's package (tray/, WP7b). Only app.py needs a desktop; the
    # installer's smoke test covers that part on a Windows runner.
    name: Tray (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy --strict)
        # Twice, so the Windows-only code (sys.platform == "win32") is checked
        # on every runner, not just on Windows.
        run: |
          mypy
          mypy --platform win32
      - name: Test (pytest)
        run: pytest
