name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "server[dev]"
      - name: Lint (ruff)
        working-directory: server
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy --strict)
        working-directory: server
        run: mypy
      - name: Test (pytest)
        working-directory: server
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  dist:
    # Assembles dist\ (no installer, no Caddy) when a pull request touches the
    # installer or the dependencies, so a wheel missing for win_amd64 shows up
    # here rather than on release day.
    name: Installer folder (dist)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the installer or the dependencies change?
        id: changes
        run: |
          $changed = git diff --name-only "origin/$env:GITHUB_BASE_REF...HEAD"
          $relevant = $changed | Where-Object { $_ -like 'installer/*' -or $_ -eq 'server/pyproject.toml' }
          "build=$([bool]$relevant)".ToLower() >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.build == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.build == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Assemble dist\app without Caddy
        if: steps.changes.outputs.build == 'true'
        run: ./installer/build.ps1 -SkipCaddy
